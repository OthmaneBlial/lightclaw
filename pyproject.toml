[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lightclaw-ai"
version = "0.1.0.dev0"
description = "Telegram mission control for reviewed, verified work by local Codex and Claude agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Othmane Blial" },
]
keywords = [
  "ai-agent",
  "claude-code",
  "codex",
  "coding-agent",
  "developer-tools",
  "remote-coding",
  "self-hosted",
  "telegram-bot",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development",
]
dependencies = [
  "httpx==0.28.1",
  "python-dotenv==1.2.3",
  "python-telegram-bot>=21,<23",
]

[project.optional-dependencies]
openai = [
  "openai>=2,<4",
]
claude = [
  "anthropic>=1,<2",
]
gemini = [
  "google-genai>=2,<3",
]
providers = [
  "anthropic>=1,<2",
  "google-genai>=2,<3",
  "openai>=2,<4",
]
dev = [
  "anthropic>=1,<2",
  "build>=1.2,<2",
  "google-genai>=2,<3",
  "openai>=2,<4",
  "pip-audit>=2.8,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.urls]
Homepage = "https://othmaneblial.github.io/lightclaw/"
Documentation = "https://github.com/OthmaneBlial/lightclaw/tree/main/docs"
Issues = "https://github.com/OthmaneBlial/lightclaw/issues"
Repository = "https://github.com/OthmaneBlial/lightclaw.git"
Changelog = "https://github.com/OthmaneBlial/lightclaw/blob/main/CHANGELOG.md"
Releases = "https://github.com/OthmaneBlial/lightclaw/releases"

[project.scripts]
lightclaw = "lightclaw_cli:main"

[tool.setuptools]
include-package-data = true
py-modules = ["config", "lightclaw_cli", "main", "memory", "providers", "skills"]

[tool.setuptools.packages.find]
include = ["core", "core.*"]

[tool.setuptools.data-files]
"share/lightclaw" = [".env.example"]
"share/lightclaw/templates/personality" = [
  "templates/personality/HEARTBEAT.md",
  "templates/personality/IDENTITY.md",
  "templates/personality/SOUL.md",
  "templates/personality/USER.md",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E501"]
