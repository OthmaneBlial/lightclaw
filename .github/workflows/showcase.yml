name: Showcase privacy and reproducibility

on:
  push:
    branches: [main]
    paths:
      - "showcase/**"
      - "examples/**"
      - "scripts/validate_showcase.py"
      - "tests/test_showcase.py"
      - ".github/workflows/showcase.yml"
  pull_request:
    branches: [main]
    paths:
      - "showcase/**"
      - "examples/**"
      - "scripts/validate_showcase.py"
      - "tests/test_showcase.py"
      - ".github/workflows/showcase.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Sanitize and replay submitted entries
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate privacy contracts and replay recipes
        run: python scripts/validate_showcase.py --execute

