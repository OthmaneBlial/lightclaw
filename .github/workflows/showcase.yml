name: Showcase privacy and reproducibility

on:
  push:
    branches: [main]
    paths:
      - "showcase/**"
      - "examples/**"
      - "scripts/validate_showcase.py"
      - "tests/test_showcase.py"
      - ".github/workflows/showcase.yml"
  pull_request:
    branches: [main]
    paths:
      - "showcase/**"
      - "examples/**"
      - "scripts/validate_showcase.py"
      - "tests/test_showcase.py"
      - ".github/workflows/showcase.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Sanitize and replay submitted entries
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate privacy contracts and replay recipes
        run: python scripts/validate_showcase.py --execute
