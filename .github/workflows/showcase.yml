name: Showcase privacy and reproducibility

# Temporarily paused while the repository-wide product refresh is in progress.
# Restore the previous path-filtered push and pull_request triggers from git
# history once the refresh is complete.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Sanitize and replay submitted entries
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate privacy contracts and replay recipes
        run: python scripts/validate_showcase.py --execute
