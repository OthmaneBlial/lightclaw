name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish the current PEP 440 prerelease to PyPI after all build checks
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install release tools
        run: python -m pip install --disable-pip-version-check build packaging twine 'pytest>=9.0.3,<10'
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag_object_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" --jq .verification.verified)" = true
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$package_version"
          python -c 'from packaging.version import Version; import sys; version = Version(sys.argv[1]); assert not version.is_prerelease and not version.is_devrelease, "tag publication is stable-only; use the guarded manual prerelease path"' "$package_version"
          python scripts/aggregate_alpha_reports.py --check launch/alpha/aggregate.json --require-ready
          python scripts/check_release_notes.py "docs/releases/$RELEASE_TAG.md" --version "$package_version" --published
      - name: Verify manual prerelease version
        if: github.event_name == 'workflow_dispatch' && inputs.publish_prerelease
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -c 'from packaging.version import Version; import sys; version = Version(sys.argv[1]); assert version.is_prerelease or version.is_devrelease, "manual publication is prerelease-only"' "$package_version"
      - name: Run tests and deterministic stories
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
          python scripts/validate_showcase.py --execute
          demo_root="$(mktemp -d)"
          lightclaw demo --scenario memory --output "$demo_root/memory" --json
          lightclaw demo --scenario repo-task --output "$demo_root/repo-task" --json
          lightclaw demo --scenario multi-agent --output "$demo_root/multi-agent" --json
          test -s "$demo_root/repo-task/phone-to-patch.json"
          test -s "$demo_root/repo-task/review/changes.patch"
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Measure release runtime footprint
        run: |
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          python -m bench.runtime_footprint --wheel "$wheel_path" --output evidence/runtime-footprint.json
      - name: Attest distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
      - name: Upload runtime footprint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-footprint
          path: evidence/runtime-footprint.json
          if-no-files-found: error

  github-release-assets:
    name: Publish verified GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, pypi, ghcr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Download runtime footprint
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-footprint
          path: evidence
      - name: Create release with verified assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* evidence/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "LightClaw $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            --verify-tag

  pypi:
    name: Publish to PyPI with OIDC
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_prerelease)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lightclaw-ai/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Publish distributions and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  ghcr:
    name: Publish optional GHCR image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Log in to GHCR
        env:
          REGISTRY_PASSWORD: ${{ github.token }}
        run: printf '%s' "$REGISTRY_PASSWORD" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push versioned image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.version=$RELEASE_TAG" --tag "$image:$RELEASE_TAG" --tag "$image:latest" .
          docker push "$image:$RELEASE_TAG"
          docker push "$image:latest"
