name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish the verified distributions to PyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install release tools
        run: python -m pip install --disable-pip-version-check build twine 'pytest>=9.0.3,<10'
      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$package_version"
      - name: Run tests and deterministic stories
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
          python scripts/validate_showcase.py --execute
          demo_root="$(mktemp -d)"
          lightclaw demo --scenario memory --output "$demo_root/memory" --json
          lightclaw demo --scenario repo-task --output "$demo_root/repo-task" --json
          lightclaw demo --scenario multi-agent --output "$demo_root/multi-agent" --json
          test -s "$demo_root/repo-task/phone-to-patch.json"
          test -s "$demo_root/repo-task/review/changes.patch"
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Measure release runtime footprint
        run: |
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          python -m bench.runtime_footprint --wheel "$wheel_path" --output evidence/runtime-footprint.json
      - name: Attest distributions
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
      - name: Upload runtime footprint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-footprint
          path: evidence/runtime-footprint.json
          if-no-files-found: error

  github-release-assets:
    name: Attach verified release assets
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Download runtime footprint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-footprint
          path: evidence
      - name: Attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* evidence/* --repo "$GITHUB_REPOSITORY" --clobber

  pypi:
    name: Publish to PyPI with OIDC
    if: github.event_name == 'release' || inputs.publish_pypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lightclaw-ai/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Publish distributions and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  ghcr:
    name: Publish optional GHCR image
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Log in to GHCR
        env:
          REGISTRY_PASSWORD: ${{ github.token }}
        run: printf '%s' "$REGISTRY_PASSWORD" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push versioned image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.version=$RELEASE_TAG" --tag "$image:$RELEASE_TAG" --tag "$image:latest" .
          docker push "$image:$RELEASE_TAG"
          docker push "$image:latest"
