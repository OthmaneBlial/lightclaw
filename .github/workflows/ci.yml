name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q

  quality:
    name: Quality and package smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Lint
        run: ruff check config.py lightclaw_cli.py main.py memory.py providers.py skills.py core tests
      - name: Validate community skill contract
        run: lightclaw skills validate --path examples/safe-skill
      - name: Verify generated provider compatibility matrix
        run: python scripts/generate_provider_matrix.py --check
      - name: Enforce architecture and growth budget
        run: |
          python scripts/check_architecture.py --check
          python -m bench.runtime_footprint --output /tmp/lightclaw-runtime-footprint.json
      - name: Test with coverage evidence
        run: python -m pytest --cov=core --cov=config --cov=lightclaw_cli --cov=memory --cov=providers --cov=skills --cov-report=term-missing --cov-report=xml
      - name: Run all token-free product stories
        run: |
          demo_root="$(mktemp -d)"
          lightclaw demo --scenario memory --output "$demo_root/memory" --json
          lightclaw demo --scenario repo-task --output "$demo_root/repo-task" --json
          lightclaw demo --scenario multi-agent --output "$demo_root/multi-agent" --json
          test -s "$demo_root/memory/receipt.json"
          test -s "$demo_root/repo-task/artifact/test-output.txt"
          test -s "$demo_root/repo-task/phone-to-patch.json"
          test -s "$demo_root/repo-task/review/changes.patch"
          test -s "$demo_root/multi-agent/artifact/final-audit.json"
      - name: Run reproducible fixture benchmark
        run: |
          python -m bench.run --mode fixture --runs 3 --output /tmp/lightclaw-bench
          test -s /tmp/lightclaw-bench.json
          test -s /tmp/lightclaw-bench.csv
      - name: Evaluate namespaced lexical memory
        run: |
          python -m bench.memory_eval --output /tmp/lightclaw-memory-eval.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/lightclaw-memory-eval.json', encoding='utf-8'))
          assert report['lexical']['mean_recall_at_k'] >= 0.8
          assert report['lexical']['cross_namespace_results'] == 0
          assert report['fixture_hybrid']['cross_namespace_results'] == 0
          PY
      - name: Audit Python dependencies
        run: pip-audit --skip-editable
      - name: Build wheel and source distribution
        run: python -m build
      - name: Smoke-test built wheel in a clean environment
        run: |
          python -m venv /tmp/lightclaw-wheel-smoke
          /tmp/lightclaw-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/lightclaw-wheel-smoke/bin/lightclaw --help
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
