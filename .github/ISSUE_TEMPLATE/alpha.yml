name: Alpha installation report
description: Submit bounded, sanitized installation and time-to-success evidence.
title: "[Alpha]: "
labels: ["alpha-report", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing LightClaw as an external self-hoster. This issue is public.
        Never include prompts, receipts, repository names/content, local paths, Telegram
        identities, tokens, request IDs, screenshots, or other private data.
        GitHub preselects the first dropdown value, so every dropdown starts with the most
        conservative answer. Change it only when you directly observed a different result.
  - type: checkboxes
    id: consent
    attributes:
      label: Privacy and aggregate consent
      options:
        - label: I am not the LightClaw maintainer and attempted this on my own environment.
          required: true
        - label: This report contains only synthetic or explicitly publishable information.
          required: true
        - label: The maintainer may include these bounded values in an anonymous aggregate.
          required: true
  - type: input
    id: version
    attributes:
      label: LightClaw version or commit
      placeholder: v0.1.0 or 0123abc
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS family
      options: [Other/unspecified, Linux, macOS]
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Enter the exact major/minor version. Supported releases are 3.10–3.13.
      placeholder: "3.13"
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Isolated install method
      options: [Other/unspecified, pipx, uv tool, virtual environment, container]
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Did the fresh install complete?
      options: ["No", "Yes"]
    validations:
      required: true
  - type: dropdown
    id: demo
    attributes:
      label: Did the deterministic demo complete?
      options: ["Not attempted because install failed", "No", "Yes"]
    validations:
      required: true
  - type: input
    id: demo_seconds
    attributes:
      label: Deterministic time-to-success in seconds
      description: Enter a whole number, or `not completed`. Do not estimate an omitted value.
      placeholder: "145"
    validations:
      required: true
  - type: dropdown
    id: telegram
    attributes:
      label: Did a real Telegram task with disposable data complete?
      options: ["Not attempted", "No", "Yes"]
    validations:
      required: true
  - type: input
    id: telegram_seconds
    attributes:
      label: Telegram time-to-first-result in seconds
      description: Enter a whole number, or `not completed` / `not attempted`.
      placeholder: "420"
    validations:
      required: true
  - type: dropdown
    id: artifact
    attributes:
      label: Was the expected artifact or receipt produced?
      options: ["Not attempted", "No", "Yes"]
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Optional smallest sanitized failure
      description: Keep this empty when it would reveal any private data.
      placeholder: One bounded reproduction using only disposable data.
