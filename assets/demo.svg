<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">LightClaw Telegram-to-verified-work demo</title>
  <desc id="desc">A silent, captioned 24-second loop showing a Telegram goal, DAG approval, two worker lanes, tests, artifacts, and a private run receipt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081018"/>
      <stop offset="1" stop-color="#102b30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#72f1b8"/>
      <stop offset="1" stop-color="#58c7ff"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".35"/></filter>
    <style>
      .ui{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.muted{fill:#8ca5aa}.white{fill:#edf7f5}.green{fill:#72f1b8}.cyan{fill:#58c7ff}.small{font-size:15px}.body{font-size:18px}.label{font-size:13px;font-weight:700;letter-spacing:1.5px}.title{font-size:28px;font-weight:750}
    </style>
  </defs>
  <rect width="1200" height="650" rx="30" fill="url(#bg)"/>
  <path d="M0 520 C240 430 350 640 610 530 S990 430 1200 540 V650 H0Z" fill="#0d2027" opacity=".8"/>
  <text x="60" y="62" class="sans title white">From pocket request to verified result</text>
  <text x="60" y="91" class="sans body muted">A 24-second deterministic walkthrough · silent and captioned</text>

  <g filter="url(#shadow)">
    <rect x="58" y="125" width="420" height="455" rx="34" fill="#101c25" stroke="#36515a"/>
    <rect x="78" y="151" width="380" height="405" rx="22" fill="#0d171e"/>
  </g>
  <circle cx="109" cy="180" r="15" fill="url(#accent)"/>
  <text x="136" y="186" class="sans body white" font-weight="700">LightClaw</text>
  <text x="401" y="184" class="sans small green">secure</text>
  <line x1="78" y1="205" x2="458" y2="205" stroke="#283b43"/>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.02;.21;.25;1" dur="24s" repeatCount="indefinite"/>
    <rect x="142" y="231" width="288" height="77" rx="18" fill="#275e55"/>
    <text x="162" y="257" class="sans small white">Add a health check, test it,</text>
    <text x="162" y="281" class="sans small white">and return only verified work.</text>
    <text x="94" y="340" class="sans label green">1 · GOAL RECEIVED</text>
    <text x="94" y="371" class="sans small muted">Scope: fixture repo only</text>
    <text x="94" y="396" class="sans small muted">Capability: workspace-write</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.21;.25;.42;.46;1" dur="24s" repeatCount="indefinite"/>
    <text x="94" y="243" class="sans label cyan">2 · REVIEW THE DAG</text>
    <rect x="94" y="266" width="330" height="54" rx="12" fill="#182a33" stroke="#31505b"/>
    <circle cx="117" cy="293" r="8" fill="#72f1b8"/><text x="137" y="299" class="ui small white">builder · create health()</text>
    <path d="M117 320 V342" stroke="#58c7ff" stroke-width="2"/>
    <rect x="94" y="342" width="330" height="54" rx="12" fill="#182a33" stroke="#31505b"/>
    <circle cx="117" cy="369" r="8" fill="#58c7ff"/><text x="137" y="375" class="ui small white">verifier · run unittest</text>
    <rect x="94" y="427" width="150" height="43" rx="13" fill="#72f1b8"/><text x="134" y="454" class="sans small" fill="#071713" font-weight="800">APPROVE</text>
    <rect x="258" y="427" width="92" height="43" rx="13" fill="#1b3038"/><text x="282" y="454" class="sans small muted">EDIT</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.42;.46;.70;.74;1" dur="24s" repeatCount="indefinite"/>
    <text x="94" y="243" class="sans label green">3 · WORK IS VISIBLE</text>
    <rect x="94" y="267" width="330" height="57" rx="12" fill="#14272e"/>
    <text x="112" y="291" class="ui small cyan">builder</text><text x="190" y="291" class="ui small white">service.py</text>
    <rect x="112" y="304" width="266" height="4" rx="2" fill="#29424b"/><rect x="112" y="304" width="240" height="4" rx="2" fill="#72f1b8"><animate attributeName="width" values="20;240" dur="4s" begin="11s" repeatCount="indefinite"/></rect>
    <rect x="94" y="339" width="330" height="57" rx="12" fill="#14272e"/>
    <text x="112" y="363" class="ui small cyan">verifier</text><text x="207" y="363" class="ui small white">python -m unittest</text>
    <rect x="112" y="376" width="266" height="4" rx="2" fill="#29424b"/><rect x="112" y="376" width="240" height="4" rx="2" fill="#58c7ff"/>
    <text x="94" y="443" class="sans small muted">No provider keys enter worker env</text>
    <text x="94" y="472" class="sans small muted">Timeout kills the process tree</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.70;.74;1" dur="24s" repeatCount="indefinite"/>
    <text x="94" y="243" class="sans label green">4 · VERIFIED RESULT</text>
    <text x="94" y="282" class="sans body white">✓ 1 test passed</text>
    <text x="94" y="315" class="sans body white">✓ 3 files recorded</text>
    <text x="94" y="348" class="sans body white">✓ receipt.json + receipt.md</text>
    <rect x="94" y="391" width="330" height="75" rx="14" fill="#122a2a" stroke="#397967"/>
    <text x="113" y="421" class="ui small green">status: accepted</text>
    <text x="113" y="448" class="ui small muted">cost: $0 · tokens: 0 · undo: ready</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="125" width="622" height="455" rx="26" fill="#0c171d" stroke="#2b444c"/>
  </g>
  <text x="555" y="171" class="sans label cyan">RUN RECEIPT · LOCAL BY DEFAULT</text>
  <line x1="555" y1="192" x2="1107" y2="192" stroke="#2a4149"/>
  <text x="555" y="232" class="ui small muted">goal</text><text x="700" y="232" class="ui small white">health check + real test</text>
  <text x="555" y="268" class="ui small muted">risk</text><text x="700" y="268" class="ui small green">low / scoped workspace</text>
  <text x="555" y="304" class="ui small muted">plan</text><text x="700" y="304" class="ui small white">builder → verifier</text>
  <text x="555" y="340" class="ui small muted">command</text><text x="700" y="340" class="ui small white">python -m unittest -v</text>
  <text x="555" y="376" class="ui small muted">evidence</text><text x="700" y="376" class="ui small green">PASS · actual exit 0</text>
  <text x="555" y="412" class="ui small muted">artifacts</text><text x="700" y="412" class="ui small white">changes.patch · test evidence</text>
  <text x="555" y="448" class="ui small muted">recovery</text><text x="700" y="448" class="ui small white">owned directory only</text>
  <rect x="555" y="486" width="552" height="54" rx="15" fill="#102b2b"/>
  <circle cx="582" cy="513" r="8" fill="#72f1b8"/>
  <text x="604" y="519" class="sans body white">Proof, not “trust me”</text>
</svg>
