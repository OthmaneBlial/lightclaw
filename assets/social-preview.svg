  <text x="64" y="154" fill="#9ea6a4" font-family="Menlo, monospace" font-size="16" letter-spacing="1.5">TELEGRAM MISSION CONTROL / LOCAL CODING AGENTS</text>
  <text x="62" y="256" fill="#f1efe7" font-family="Avenir Next Condensed, Helvetica Neue, sans-serif" font-size="74" font-weight="800" letter-spacing="-2">SEND THE MISSION.</text>
  <text x="62" y="330" fill="#ff6a2a" font-family="Avenir Next Condensed, Helvetica Neue, sans-serif" font-size="74" font-weight="800" letter-spacing="-2">KEEP THE PROOF.</text>
  <text x="64" y="382" fill="#b8c0be" font-family="Helvetica Neue, sans-serif" font-size="20">Review the scope before Codex or Claude runs.</text>
  <text x="64" y="414" fill="#b8c0be" font-family="Helvetica Neue, sans-serif" font-size="20">Get the checks, patch, private receipt, and undo path after.</text>

