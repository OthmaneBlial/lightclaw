<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">LightClaw — Hand off a task. Keep the proof.</title>
  <desc id="desc">A colorful Telegram mission card: review the plan, approve the work, then inspect tests, a patch, and a private receipt.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#172b3b" opacity=".12"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="8" dy="10" stdDeviation="0" flood-color="#172b3b" flood-opacity=".95"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="34" fill="#fff8eb"/>
  <rect width="1280" height="640" rx="34" fill="url(#dots)"/>
  <circle cx="770" cy="82" r="78" fill="#d4ef72"/>
  <circle cx="82" cy="564" r="108" fill="#f6a6c7" opacity=".7"/>

  <g transform="translate(64 53)">
    <rect width="52" height="52" rx="17" fill="#ff6b4e" stroke="#172b3b" stroke-width="3"/>
    <path d="M15 13v12c0 8 5 14 11 17 7-3 11-9 11-17V13M15 20l8 7-4 6m18-13-8 7 4 6m-10-6 3-5 4 5m-4-5v15" fill="none" stroke="#172b3b" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="130" y="78" fill="#172b3b" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="25" font-weight="900" letter-spacing="2">LIGHTCLAW</text>
  <rect x="130" y="91" width="228" height="30" rx="15" fill="#ffe178" stroke="#172b3b" stroke-width="1.5"/>
  <text x="145" y="111" fill="#172b3b" font-family="Menlo, monospace" font-size="12" font-weight="700" letter-spacing=".6">🐾 POCKET MISSION CONTROL</text>

  <text x="64" y="228" fill="#172b3b" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="69" font-weight="900" letter-spacing="-3">HAND OFF A TASK.</text>
  <text x="64" y="307" fill="#344ac3" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="69" font-weight="900" letter-spacing="-3">KEEP THE PROOF.</text>
  <text x="66" y="360" fill="#405667" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="21" font-weight="600">Codex + Claude · Telegram · you stay in charge.</text>

  <g font-family="Menlo, monospace" font-size="13" font-weight="700">
    <g transform="translate(66 407)">
      <rect width="173" height="43" rx="14" fill="#d4ef72" stroke="#172b3b" stroke-width="2"/>
      <text x="15" y="27" fill="#172b3b">🗺️ PLAN FIRST</text>
    </g>
    <g transform="translate(252 407)">
      <rect width="181" height="43" rx="14" fill="#75dfbf" stroke="#172b3b" stroke-width="2"/>
      <text x="14" y="27" fill="#172b3b">🧪 REAL CHECKS</text>
    </g>
    <g transform="translate(446 407)">
      <rect width="223" height="43" rx="14" fill="#f6a6c7" stroke="#172b3b" stroke-width="2"/>
      <text x="14" y="27" fill="#172b3b">🧾 PRIVATE RECEIPT</text>
    </g>
  </g>

  <g transform="translate(66 493)" font-family="Menlo, monospace">
    <rect width="690" height="84" rx="20" fill="#172b3b"/>
    <text x="25" y="34" fill="#ffe178" font-size="13" font-weight="700">THE LITTLE LOOP</text>
    <text x="25" y="62" fill="#fff8eb" font-size="17" font-weight="600">📩 Ask</text>
    <text x="116" y="62" fill="#ff9c80" font-size="20">→</text>
    <text x="151" y="62" fill="#fff8eb" font-size="17" font-weight="600">🙋 Approve</text>
    <text x="282" y="62" fill="#ff9c80" font-size="20">→</text>
    <text x="318" y="62" fill="#fff8eb" font-size="17" font-weight="600">🤖 Run</text>
    <text x="402" y="62" fill="#ff9c80" font-size="20">→</text>
    <text x="438" y="62" fill="#fff8eb" font-size="17" font-weight="600">✅ Review</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="828" y="55" width="390" height="538" rx="34" fill="#ff6b4e" stroke="#172b3b" stroke-width="3"/>
    <rect x="850" y="77" width="346" height="494" rx="24" fill="#fffdf8" stroke="#172b3b" stroke-width="2"/>
  </g>
  <text x="875" y="111" fill="#344ac3" font-family="Menlo, monospace" font-size="12" font-weight="700">📱 TELEGRAM / YOUR RUN</text>
  <line x1="872" y1="128" x2="1174" y2="128" stroke="#c7c9bc" stroke-width="2"/>

  <rect x="873" y="148" width="284" height="84" rx="18" fill="#dff7ee" stroke="#172b3b" stroke-width="2"/>
  <text x="891" y="174" fill="#146451" font-family="Menlo, monospace" font-size="11" font-weight="700">YOU → LIGHTCLAW</text>
  <text x="891" y="200" fill="#172b3b" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="15" font-weight="600">“Add a health check.</text>
  <text x="891" y="220" fill="#172b3b" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="15" font-weight="600">Test it. Show me the patch.”</text>

  <text x="875" y="263" fill="#344ac3" font-family="Menlo, monospace" font-size="11" font-weight="700">🗺️ PLAN — YOUR CALL</text>
  <rect x="873" y="277" width="300" height="94" rx="16" fill="#edf0ff" stroke="#172b3b" stroke-width="2"/>
  <circle cx="897" cy="304" r="8" fill="#ff6b4e" stroke="#172b3b" stroke-width="1.5"/>
  <text x="915" y="309" fill="#172b3b" font-family="Menlo, monospace" font-size="14" font-weight="700">builder</text>
  <text x="915" y="328" fill="#506374" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="12">service.py · scoped workspace</text>
  <path d="M897 315v31" stroke="#5268e8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="897" cy="351" r="8" fill="#75dfbf" stroke="#172b3b" stroke-width="1.5"/>
  <text x="915" y="356" fill="#172b3b" font-family="Menlo, monospace" font-size="14" font-weight="700">verifier</text>

  <rect x="873" y="389" width="300" height="49" rx="15" fill="#ffe178" stroke="#172b3b" stroke-width="2"/>
  <text x="944" y="420" fill="#172b3b" font-family="Menlo, monospace" font-size="15" font-weight="800">🙋 APPROVE PLAN</text>

  <rect x="873" y="456" width="300" height="92" rx="16" fill="#d4ef72" stroke="#172b3b" stroke-width="2"/>
  <text x="892" y="482" fill="#146451" font-family="Menlo, monospace" font-size="11" font-weight="700">🧪 RESULT READY</text>
  <text x="892" y="508" fill="#172b3b" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="14" font-weight="700">✓ Test evidence · patch</text>
  <text x="892" y="531" fill="#172b3b" font-family="Avenir Next, Trebuchet MS, sans-serif" font-size="14" font-weight="700">✓ Private receipt · undo path</text>

  <g transform="rotate(12 779 186)">
    <rect x="739" y="148" width="80" height="72" rx="20" fill="#ffe178" stroke="#172b3b" stroke-width="2"/>
    <text x="759" y="196" font-family="Apple Color Emoji, Noto Color Emoji, sans-serif" font-size="33">✨</text>
  </g>
  <g transform="rotate(-10 782 344)">
    <circle cx="783" cy="343" r="29" fill="#b6c3ff" stroke="#172b3b" stroke-width="2"/>
    <text x="763" y="355" font-family="Apple Color Emoji, Noto Color Emoji, sans-serif" font-size="23">🐾</text>
  </g>
  <text x="1160" y="614" fill="#506374" font-family="Menlo, monospace" font-size="11" font-weight="700">LOCAL-FIRST · ALPHA · MIT</text>
</svg>
