    <text x="132" y="34" fill="#647073">→</text>
    <text x="168" y="34" fill="#f1efe7">SCOPE REVIEW</text>
    <text x="316" y="34" fill="#647073">→</text>
    <text x="352" y="34" fill="#f1efe7">LOCAL AGENTS</text>
    <text x="494" y="34" fill="#647073">→</text>
    <text x="530" y="34" fill="#9df7c6">PATCH + RECEIPT</text>
    <text x="22" y="61" fill="#778180">bounded work · acceptance checks · local evidence · scoped recovery</text>
  </g>

  <g transform="translate(836 74)">
