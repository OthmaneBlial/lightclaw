    <rect x="1" y="1" width="378" height="56" fill="#12181b"/>
    <text x="22" y="35" fill="#9ea6a4" font-family="Menlo, monospace" font-size="13">RUN RECEIPT / 0142</text>
    <rect x="274" y="17" width="82" height="24" fill="none" stroke="#9df7c6"/>
    <text x="287" y="34" fill="#9df7c6" font-family="Menlo, monospace" font-size="11">ACCEPTED</text>

    <text x="22" y="94" fill="#6e7978" font-family="Menlo, monospace" font-size="11">APPROVED SCOPE</text>
    <text x="22" y="120" fill="#f1efe7" font-family="Helvetica Neue, sans-serif" font-size="17">service.py · test_service.py</text>
    <path d="M22 142H358" stroke="#293236"/>
    <text x="22" y="176" fill="#6e7978" font-family="Menlo, monospace" font-size="11">CAPABILITY</text>
    <text x="22" y="202" fill="#f1efe7" font-family="Helvetica Neue, sans-serif" font-size="17">workspace-write · low risk</text>
    <path d="M22 224H358" stroke="#293236"/>
    <text x="22" y="258" fill="#6e7978" font-family="Menlo, monospace" font-size="11">ACCEPTANCE</text>
    <text x="22" y="286" fill="#9df7c6" font-family="Menlo, monospace" font-size="15">✓ unit tests passed</text>
    <text x="22" y="316" fill="#9df7c6" font-family="Menlo, monospace" font-size="15">✓ patch recorded</text>
    <text x="22" y="346" fill="#9df7c6" font-family="Menlo, monospace" font-size="15">✓ receipt generated</text>
    <path d="M22 370H358" stroke="#293236"/>
    <text x="22" y="404" fill="#6e7978" font-family="Menlo, monospace" font-size="11">RECOVERY</text>
    <text x="22" y="432" fill="#65e6ef" font-family="Menlo, monospace" font-size="15">scoped undo ready ↶</text>
    <text x="22" y="464" fill="#687273" font-family="Menlo, monospace" font-size="11">PRIVATE + LOCAL BY DEFAULT</text>
