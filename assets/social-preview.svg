<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">LightClaw social preview</title>
  <desc id="desc">Industrial mission-control graphic showing Telegram, scope review, local coding agents, tests, patch, and run receipt.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#263136" stroke-width="1" opacity=".55"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65e6ef" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#07090a" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff6a2a" stop-opacity=".14"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#07090a"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <path d="M0 26H1280M0 614H1280" stroke="#435057"/>
  <path d="M64 72H642" stroke="#ff6a2a" stroke-width="2"/>

  <g transform="translate(64 54)" fill="none" stroke="#ff6a2a" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <path d="M0 0v24c0 18 12 34 30 42 18-8 30-24 30-42V0"/>
    <path d="M0 12l18 16-10 16M60 12L42 28l10 16M18 28L30 12l12 16M30 12v42"/>
  </g>

